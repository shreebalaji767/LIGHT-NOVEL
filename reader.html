<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader — LIGHTNOVEL.EXE</title>
<link rel="stylesheet" href="css/reader.css">
</head>
<body>
<header class="readerbar">
  <a href="index.html">← LIBRARY</a>
  <div id="counter">CHAPTER 1 / 520</div>
</header>
<main class="layout">
  <aside class="sidebar">
    <p class="eyebrow">CURRENT NOVEL</p>
    <h1 id="novelTitle">Loading…</h1>
    <div class="box"><b>WORLD</b><p id="world">—</p><p id="worldSummary">—</p></div>
    <div class="box"><b>POV</b><p id="pov">—</p><p id="role">—</p></div>
    <div class="box"><b>STORY STATUS</b><p id="status">—</p></div>
  </aside>
  <article class="reader">
    <p id="meta" class="meta">—</p>
    <h2 id="chapterTitle">Loading chapter…</h2>
    <div id="text" class="text"></div>
    <nav class="controls">
      <button id="prev">← PREVIOUS</button>
      <button id="next">NEXT →</button>
    </nav>
  </article>
</main>
<script src="js/reader.js"></script>
</body>
</html>
